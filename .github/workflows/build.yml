# CI : vérifie le build Release, les tests déterministes et les dépendances NuGet.
# Pas de publish : le protocole de release local
# (MISE_A_JOUR_PROTOCOLE.txt) reste la seule voie de publication.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Release
        run: dotnet build Tweakly.csproj -c Release --nologo

      - name: Audit NuGet vulnerabilities
        run: dotnet list Tweakly.csproj package --vulnerable --include-transitive

      - name: Test Tweakly helpers and registry rules
        run: dotnet run --project Tweakly.RegistryTests/Tweakly.RegistryTests.csproj -c Release

      - name: Test fan control core
        run: dotnet run --project FanControl.Tests/FanControl.Tests.csproj -c Release

      - name: Test GPU tuning core
        run: dotnet run --project GpuTuningLab.Tests/GpuTuningLab.Tests.csproj -c Release

      - name: Test registry repair core
        run: dotnet run --project Labs/RegistryRepairLab/RegistryRepair.Tests/RegistryRepair.Tests.csproj -c Release
